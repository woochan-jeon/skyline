<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Clean Sky</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1220;
      color: #e8eefc;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px;
    }
    #wrap { position: relative; }
    canvas {
      display: block;
      width: min(92vw, calc((100vh - 90px) * 2 / 3));
      aspect-ratio: 2 / 3;
      background: #16324f;
      border-radius: 12px;
      touch-action: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }
    #status {
      font-size: 13px;
      opacity: 0.85;
    }
    #status.ok { color: #7ee2a8; }
    #status.local { color: #ffd479; }
    #help {
      font-size: 13px;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="480" height="720"></canvas>
  </div>
  <div id="status">서버 확인 중...</div>
  <div id="help">이동: 방향키 / WASD &nbsp;·&nbsp; 발사: 스페이스 &nbsp;·&nbsp; 모바일: 화면을 누르고 드래그</div>

  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
