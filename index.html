<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Clean Sky</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b1220;
      color: #e8eefc;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    body { padding: 10px; }
    #layout {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
    }
    #stage { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    canvas {
      display: block;
      width: min(92vw, calc((100vh - 110px) * 2 / 3));
      aspect-ratio: 2 / 3;
      background: #16324f;
      border-radius: 12px;
      touch-action: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }
    #status { font-size: 13px; opacity: 0.85; }
    #status.ok { color: #7ee2a8; }
    #status.local { color: #ffd479; }
    #help { font-size: 13px; opacity: 0.7; text-align: center; }

    #panel {
      width: min(92vw, 320px);
      background: #121c31;
      border: 1px solid #22314f;
      border-radius: 12px;
      padding: 14px;
    }
    #panel h2 { margin: 0 0 10px; font-size: 16px; }
    .row { display: flex; gap: 8px; }
    #nick {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #34486d;
      background: #0b1220;
      color: inherit;
      font-size: 15px;
    }
    button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 0;
      background: #3b82f6;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { background: #2a3a5c; color: #8fa0c4; cursor: default; }
    #submitMsg { min-height: 20px; margin: 8px 0 12px; font-size: 13px; color: #c9d6ee; }
    #submitMsg.ok { color: #7ee2a8; }
    #submitMsg.err { color: #ff9aa5; }
    #tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .tab { background: #1b2a47; color: #b7c6e6; }
    .tab.active { background: #3b82f6; color: #fff; }
    #board { margin: 0; padding-left: 0; list-style: none; font-size: 14px; }
    #board li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 4px;
      border-bottom: 1px solid #1d2b47;
    }
    #board .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #board .num { color: #7f93bb; width: 22px; flex: none; }
    #board .pts { font-variant-numeric: tabular-nums; }
    #board .empty { color: #8fa0c4; justify-content: center; }
  </style>
</head>
<body>
  <div id="layout">
    <div id="stage">
      <canvas id="game" width="480" height="720"></canvas>
      <div id="status">서버 확인 중...</div>
      <div id="help">이동: 방향키 / WASD &nbsp;·&nbsp; 발사: 스페이스 &nbsp;·&nbsp; 모바일: 화면을 누르고 드래그</div>
    </div>

    <div id="panel">
      <h2>랭킹</h2>
      <div class="row">
        <input id="nick" type="text" maxlength="12" placeholder="닉네임 (1~12자)" autocomplete="off" />
        <button id="submitBtn" type="button" disabled>점수 등록</button>
      </div>
      <div id="submitMsg">게임이 끝나면 점수를 등록할 수 있어요.</div>
      <div id="tabs">
        <button id="tabDaily" class="tab active" type="button">오늘의 챌린지</button>
        <button id="tabAll" class="tab" type="button">전체</button>
      </div>
      <ol id="board"></ol>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
